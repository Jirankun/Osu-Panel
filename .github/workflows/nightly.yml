# Nightly — builds BOTH APKs (debug + release) every night at 00:00 UTC and
# on manual trigger, then publishes/updates the "nightly" GitHub release.
# - app-debug.apk   : never signed.
# - app-release.apk : signed when the SIGN_* repository secrets are configured.
# The release is NOT a draft — it is published automatically, so testers can
# always grab the latest nightly APK from the same link.
name: Nightly

on:
  schedule:
    - cron: '0 0 * * *'   # every day at 00:00 UTC
  workflow_dispatch:      # manual trigger (Actions → Nightly → Run workflow)

permissions:
  contents: write

jobs:
  nightly:
    name: Nightly build + release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        id: signing
        if: ${{ secrets.SIGN_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/osu-panel-release.jks"
          echo "key_path=$RUNNER_TEMP/osu-panel-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APKs (debug + release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          SIGN_KEY: ${{ steps.signing.outputs.key_path }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}

      - name: Read version
        id: version
        run: |
          VN=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "name=${VN}" >> "$GITHUB_OUTPUT"

      - name: Create/update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="nightly"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Nightly build — v${{ steps.version.outputs.name }} ($(date -u +%Y-%m-%d))" \
            --notes "Automatic nightly build from \`main\` (v${{ steps.version.outputs.name }}).

          - \`app-debug.apk\` — unsigned, installable on any device.
          - \`app-release.apk\` — signed (when the \`SIGN_*\` repository secrets are configured), otherwise unsigned.

          > Not a stable release — use for testing only."
