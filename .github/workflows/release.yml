# Release — created ONLY from a PR comment, never automatically.
#
#   /release            → build a release from the PR head, keep the version
#                         in gradle.properties
#   /release 1.2.3      → same, but bump APP_VERSION_NAME/CODE to 1.2.3 first
#
# Only the repository owner / members / collaborators can trigger it
# (checks author_association). The release is created as a DRAFT with the
# debug APK always attached (installable without signing) and the release
# APK when SIGN_* repository secrets are configured.
name: Release from PR comment

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.issue.pull_request != '' && startsWith(github.event.comment.body, '/release')
    runs-on: ubuntu-latest
    steps:
      - name: Allow only maintainers (owner / member / collaborator)
        id: perm
        env:
          ASSOC: ${{ github.event.comment.author_association }}
        run: |
          case "$ASSOC" in
            OWNER|MEMBER|COLLABORATOR) echo "allowed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Deny non-maintainers
        if: steps.perm.outputs.allowed != 'true'
        run: |
          echo "Only the repository owner/members/collaborators can trigger a release."
          exit 1

      - name: Resolve PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decode the keystore from the SIGN_KEYSTORE_B64 secret (base64) into a
      # temp file and export the signing env. Skipped when not configured → the
      # release APK builds unsigned.
      - name: Prepare signing key
        id: signing
        if: ${{ secrets.SIGN_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/osu-panel-release.jks"
          echo "key_path=$RUNNER_TEMP/osu-panel-release.jks" >> "$GITHUB_OUTPUT"

      # Optional version bump: `/release 1.2.3` — otherwise keep gradle.properties.
      - name: Bump version (optional)
        env:
          COMMENT: ${{ github.event.comment.body }}
        run: |
          VERSION=$(echo "$COMMENT" | sed -nE 's|^/release[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*|\1|p')
          if [ -n "$VERSION" ]; then
            CODE=$(echo "$VERSION" | tr -d '.')
            sed -i "s/^APP_VERSION_NAME=.*/APP_VERSION_NAME=$VERSION/" gradle.properties
            sed -i "s/^APP_VERSION_CODE=.*/APP_VERSION_CODE=$CODE/" gradle.properties
            echo "Bumped version to $VERSION (code $CODE)"
          else
            echo "Keeping current version from gradle.properties"
          fi

      - name: Build APKs (debug + release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          SIGN_KEY: ${{ steps.signing.outputs.key_path }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}

      - name: Read version
        id: version
        run: |
          VN=$(grep '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2)
          echo "name=${VN}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VN}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes
        run: |
          PR_NUMBER="${{ github.event.issue.number }}"
          PR_TITLE="${{ github.event.issue.title }}"
          sed -e "s/{{VERSION}}/${{ steps.version.outputs.name }}/g" \
              -e "s|{{PR}}|#$PR_NUMBER|g" \
              -e "s|{{PR_TITLE}}|$PR_TITLE|g" \
              .github/release-notes-template.md > release-notes.md

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          fi
          gh release create "$TAG" \
            app/build/outputs/apk/debug/*.apk \
            app/build/outputs/apk/release/*.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${{ steps.version.outputs.name }}" \
            --notes-file release-notes.md \
            --target "${{ steps.pr.outputs.sha }}" \
            --draft
