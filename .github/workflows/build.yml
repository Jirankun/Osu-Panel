# CI — build BOTH APKs (debug + release) on every push to main and every PR.
# - app-debug.apk  : never signed — installable on any device.
# - app-release.apk: signed when the SIGN_* repository secrets are configured
#                    (see README → Signing); otherwise it stays unsigned.
# Both are uploaded as artifacts so testers can install them directly.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build debug + release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decode the keystore from the SIGN_KEYSTORE_B64 secret (base64) into a
      # temp file and export the signing env for the build step. Skipped when
      # the secret is not configured → the release APK builds unsigned.
      - name: Prepare signing key
        id: signing
        if: ${{ secrets.SIGN_KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.SIGN_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/osu-panel-release.jks"
          echo "key_path=$RUNNER_TEMP/osu-panel-release.jks" >> "$GITHUB_OUTPUT"

      - name: Build APKs (debug + release)
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          SIGN_KEY: ${{ steps.signing.outputs.key_path }}
          SIGN_ALIAS: ${{ secrets.SIGN_ALIAS }}
          SIGN_KEY_PASS: ${{ secrets.SIGN_KEY_PASS }}
          SIGN_STORE_PASS: ${{ secrets.SIGN_STORE_PASS }}

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
