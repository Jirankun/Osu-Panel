# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX (required for Jetpack Compose / Material 3)
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# Android
android.nonTransitiveRClass=true

# ── App version (SINGLE SOURCE — the only place to bump the version) ──
# Used by build.gradle.kts (versionCode/versionName) and compared against
# the "Update available" popup (UpdateChecker reads the installed versionCode).
APP_VERSION_CODE=1
APP_VERSION_NAME=1.0.0
